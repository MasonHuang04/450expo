# DAPLink (CMSIS-DAP) over SWD. This configuration uses the standard
# DAPLink USB vendor/product ID and does not select an adapter serial number.
gdb_port disabled
tcl_port disabled
telnet_port disabled

source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x0d28 0x0204
transport select swd
set CLOCK_FREQ 1000
set CONNECT_UNDER_RESET 0
set WORKAREASIZE 0x8000
source [find target/stm32g4x.cfg]
adapter speed 1000
reset_config none
